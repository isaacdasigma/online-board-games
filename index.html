<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHub — Multiplayer Tabletop Arena</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-alt: #1b2438;
      --border: #26324d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #6366f1;
      --cyan: #0ea5e9;
      --sq-light: #e2e8f0;
      --sq-dark: #4f6d9a;
      --sq-last: rgba(56, 189, 248, 0.42);
      --sq-sel: rgba(129, 140, 248, 0.65);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #151f38 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TOP NAVIGATION BAR */
    header {
      width: 100%;
      background: rgba(19, 26, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .nav-inner {
      max-width: 1000px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.4px;
    }
    .logo-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: grid; grid-template-columns: 1fr 1fr; padding: 5px; gap: 2px;
    }
    .logo-icon span { background: rgba(255,255,255,0.9); border-radius: 2px; }
    .logo-icon span:nth-child(2), .logo-icon span:nth-child(3) { background: rgba(255,255,255,0.3); }

    .game-tabs {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--card-alt);
      color: #38bdf8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .pills { display: flex; gap: 8px; align-items: center; }
    .pill {
      font-size: 12px; font-weight: 700; padding: 5px 10px;
      border-radius: 999px; background: var(--card-alt);
      border: 1px solid var(--border); color: var(--muted);
    }
    .pill.online { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #34d399; }

    /* MAIN ARENA LAYOUT */
    .arena {
      max-width: 1000px;
      width: 100%;
      padding: 20px 16px;
      display: grid;
      grid-template-columns: minmax(300px, 500px) minmax(290px, 380px);
      gap: 24px;
      justify-content: center;
      align-items: start;
    }
    @media (max-width: 840px) {
      .arena { grid-template-columns: minmax(290px, 500px); }
    }

    /* BOARD COLUMN */
    .board-section { display: flex; flex-direction: column; gap: 10px; }
    .player-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
    }
    .p-meta { display: flex; align-items: center; gap: 10px; }
    .badge-side {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--card-alt); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: #38bdf8;
    }
    .p-title { font-weight: 700; font-size: 14px; }
    .cap-row {
      display: flex; align-items: center; flex-wrap: wrap; gap: 1px;
      font-size: 12px; font-weight: 700; color: var(--muted); min-height: 18px;
    }
    .cap-icon { width: 15px; height: 15px; display: inline-block; }

    .timer {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 19px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      min-width: 84px;
      text-align: center;
    }
    .timer.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #ffffff;
    }
    .timer.low {
      background: rgba(244, 63, 94, 0.2);
      border-color: #f43f5e;
      color: #fda4af;
    }

    .board-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    #board {
      display: grid;
      width: 100%;
      height: 100%;
      border-radius: 9px;
      overflow: hidden;
      user-select: none;
    }
    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .sq.light { background: var(--sq-light); }
    .sq.dark { background: var(--sq-dark); }
    .sq.last::before, .sq.sel::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
    }
    .sq.last::before { background: var(--sq-last); }
    .sq.sel::before { background: var(--sq-sel); }
    .sq.check { background: radial-gradient(circle, #f43f5e 25%, #9f1239 85%) !important; }

    .dot {
      width: 28%; height: 28%; border-radius: 50%;
      background: rgba(15, 23, 42, 0.25); pointer-events: none; z-index: 2;
    }
    .ring {
      position: absolute; inset: 8%; border-radius: 50%;
      border: 4px solid rgba(15, 23, 42, 0.28); pointer-events: none; z-index: 2;
    }
    .coord {
      position: absolute; font-size: 10px; font-weight: 800; pointer-events: none; opacity: 0.8;
    }
    .coord.rank { top: 2px; left: 4px; }
    .coord.file { bottom: 2px; right: 4px; }
    .light .coord { color: var(--sq-dark); }
    .dark .coord { color: var(--sq-light); }

    /* FIXED-PROPORTION VECTOR CHESS PIECES */
    .piece-svg {
      width: 78%;
      height: 78%;
      display: block;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
    }

    /* CHECKERS & CONNECT 4 PIECES */
    .chk-disc {
      width: 75%; height: 75%; border-radius: 50%; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.35);
    }
    .chk-disc.p1 { background: #f43f5e; color: #fff1f2; border: 3px solid #be123c; }
    .chk-disc.p2 { background: #fbbf24; color: #1e293b; border: 3px solid #d97706; }

    .c4-sq {
      background: #262b5c; padding: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; min-width: 0; min-height: 0; overflow: hidden;
    }
    .c4-hole { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); box-shadow: inset 0 3px 6px rgba(0,0,0,0.7); }
    .c4-hole.p1 { background: #f43f5e; }
    .c4-hole.p2 { background: #fbbf24; }

    #promoModal {
      display: none; position: absolute; inset: 0; background: rgba(11, 15, 25, 0.75);
      align-items: center; justify-content: center; z-index: 10; border-radius: 14px;
    }
    .promo-box {
      background: var(--card); border: 1px solid var(--border);
      padding: 14px; border-radius: 12px; display: flex; gap: 10px;
    }
    .promo-btn {
      width: 54px; height: 54px; padding: 6px; background: var(--card-alt);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .promo-btn:hover { border-color: #38bdf8; }

    /* RIGHT CONTROL DOCK */
    .dock { display: flex; flex-direction: column; gap: 14px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-label {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--muted);
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select, input, button.btn {
      font-family: inherit; font-size: 13px; font-weight: 700;
      border-radius: 9px; padding: 10px 12px;
      border: 1px solid var(--border);
    }
    select, input { background: var(--bg); color: var(--text); }
    input { text-align: center; width: 100%; }
    button.btn { background: var(--card-alt); color: var(--text); cursor: pointer; transition: 0.15s; }
    button.btn:hover { border-color: #38bdf8; }
    button.btn.cta {
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      border: none; color: #ffffff; font-size: 15px; padding: 12px;
    }
    button.btn.cta:hover { filter: brightness(1.1); }
    button.btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .status-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: #38bdf8;
    }
    .history {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      height: 155px;
      overflow-y: auto;
      padding: 8px;
      font-size: 13px;
      font-family: ui-monospace, monospace;
    }
    .m-row { display: grid; grid-template-columns: 36px 1fr 1fr; padding: 3px 6px; border-radius: 4px; }
    .m-row:nth-child(even) { background: rgba(255,255,255,0.03); }
    .m-idx { color: var(--muted); }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo">
      <div class="logo-icon"><span></span><span></span><span></span><span></span></div>
      <span>BoardHub</span>
    </div>

    <div class="game-tabs">
      <button class="tab-btn active" id="tab-chess" onclick="selectGame('chess')">Chess</button>
      <button class="tab-btn" id="tab-checkers" onclick="selectGame('checkers')">Checkers</button>
      <button class="tab-btn" id="tab-c4" onclick="selectGame('c4')">Connect 4</button>
    </div>

    <div class="pills">
      <span class="pill" id="netBadge">Offline</span>
      <span class="pill" id="guestBadge">guest_0000</span>
    </div>
  </div>
</header>

<div class="arena">
  <!-- LEFT: GAME BOARD -->
  <div class="board-section">
    <div class="player-strip">
      <div class="p-meta">
        <div class="badge-side" id="topAvatar">P2</div>
        <div>
          <div class="p-title" id="topName">Opponent</div>
          <div class="cap-row" id="topCap"></div>
        </div>
      </div>
      <div class="timer" id="topClock">03:00</div>
    </div>

    <div class="board-frame">
      <div id="board"></div>
      <div id="promoModal">
        <div class="promo-box" id="promoChoices"></div>
      </div>
    </div>

    <div class="player-strip">
      <div class="p-meta">
        <div class="badge-side" id="botAvatar">P1</div>
        <div>
          <div class="p-title" id="botName">You</div>
          <div class="cap-row" id="botCap"></div>
        </div>
      </div>
      <div class="timer active" id="botClock">03:00</div>
    </div>
  </div>

  <!-- RIGHT: MATCHMAKING & LOGS -->
  <div class="dock">
    <div class="panel">
      <div class="panel-label">Play Mode</div>
      <div class="row-2">
        <select id="timeSelect">
          <option value="180">3 min Blitz</option>
          <option value="60">1 min Bullet</option>
          <option value="600">10 min Rapid</option>
          <option value="0">Untimed</option>
        </select>
        <button class="btn" onclick="startLocalBot()">Play vs Bot</button>
      </div>

      <button class="btn cta" id="btnQuick" onclick="findQuickMatch()">Find Online Match</button>

      <div class="row-2">
        <button class="btn" onclick="hostFriendRoom()">Create Room</button>
        <div style="display:flex; gap:6px;">
          <input id="codeInput" placeholder="Code" maxlength="4" />
          <button class="btn" onclick="joinFriendRoom()">Join</button>
        </div>
      </div>

      <div class="status-pill" id="statusBanner">Ready to play</div>
    </div>

    <div class="panel">
      <div class="panel-label">Move Log & Controls</div>
      <div class="history" id="movesBox"></div>
      <div class="row-3">
        <button class="btn" id="btnDraw" onclick="offerDraw()" disabled>Draw</button>
        <button class="btn" id="btnResign" onclick="resignGame()" disabled>Resign</button>
        <button class="btn" id="btnRematch" onclick="requestRematch()" disabled>Rematch</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. PERSISTENT GUEST ID & SOUND ENGINE
// ==========================================
let guestId = localStorage.getItem("bh_guest_id");
if (!guestId) {
  guestId = "guest_" + Math.floor(1000 + Math.random() * 9000);
  localStorage.setItem("bh_guest_id", guestId);
}
document.getElementById("guestBadge").textContent = guestId;
const myClientId = guestId + "_" + Math.random().toString(36).slice(2, 7);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (type === "move") {
    osc.type = "triangle";
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(65, now + 0.08);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === "capture") {
    osc.type = "square";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.11);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
    osc.start(now); osc.stop(now + 0.11);
  } else if (type === "check") {
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.09);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === "end") {
    osc.type = "triangle";
    osc.frequency.setValueAtTime(330, now);
    osc.frequency.setValueAtTime(440, now + 0.12);
    osc.frequency.setValueAtTime(554, now + 0.24);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
    osc.start(now); osc.stop(now + 0.45);
  }
}

// ==========================================
// 2. CRISP VECTOR SVG CHESS PIECES
// ==========================================
function getPieceSVG(color, type, cls = "piece-svg") {
  const fill = color === "w" ? "#ffffff" : "#1e293b";
  const stroke = color === "w" ? "#0f172a" : "#020617";
  const detail = color === "w" ? "#0f172a" : "#cbd5e1";

  const shapes = {
    p: `<path d="M22.5 9a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm-4 9.5h8l1.5 3h-11l1.5-3zm-2 3.5h12c1.5 3.5 3.5 6.5 4.5 11.5h-21c1-5 3-8 4.5-11.5zM11.5 34.5h22v4h-22v-4z" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>`,
    r: `<path d="M9 39h27v-3H9v3zm3-3v-4h21v4H12zm-1-22V9h4v2h5V9h5v2h5V9h4v5l-3 3H14l-3-3zm3 3h17v12.5H14V17zm-2.5 15.5l2.5-3h17l2.5 3h-22z" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 29.5h17M14 17h17" stroke="${detail}" stroke-width="1.3"/>`,
    n: `<path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14.5" cy="15.5" r="1.2" fill="${detail}"/><path d="M9.5 39h26v-3h-26v3z" fill="${fill}" stroke="${stroke}" stroke-width="1.8"/>`,
    b: `<g fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.354.49-2.323.47-3-.5 1.354-1.94 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.5"/></g><path d="M17.5 26h10M15 30h15M22.5 15.5v5M20 18h5" stroke="${detail}" stroke-width="1.5" stroke-linecap="round"/>`,
    q: `<g fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"><circle cx="6" cy="12" r="2.2"/><circle cx="14" cy="9" r="2.2"/><circle cx="22.5" cy="8" r="2.2"/><circle cx="31" cy="9" r="2.2"/><circle cx="39" cy="12" r="2.2"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/></g><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" fill="none" stroke="${detail}" stroke-width="1.4"/>`,
    k: `<path d="M22.5 11.63V6M20 8h5" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="${fill}" stroke="${stroke}" stroke-width="1.8"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.5 30c5.5-3 15.5-3 21 0M11.5 33.5c5.5-3 15.5-3 21 0M11.5 37c5.5-3 15.5-3 21 0" fill="none" stroke="${detail}" stroke-width="1.4"/>`
  };
  return `<svg class="${cls}" viewBox="0 0 45 45">${shapes[type]}</svg>`;
}

// ==========================================
// 3. GAME STATE & TOP TAB SWITCHER
// ==========================================
let selectedGame = "chess";
let mode = "bot";
let mySide = 1;
let gameType = "chess";
let baseTime = 180;
let clocks = { 1: 180, 2: 180 };
let clockTimer = null;
let winner = 0;
let endReason = "";
let opponentName = "Minimax Bot";
let selected = null;
let legalTargets = [];
let lastMove = null;
let moveLog = [];

let chess = new Chess();
let chkBoard = [];
let chkTurn = 1;
let c4Board = [];
let c4Turn = 1;

const BROKERS = [
  "wss://mqtt.eclipseprojects.io:443/mqtt",
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt"
];
let mqttClient = null;
let lobbyTopic = "";
let roomTopic = "";
let searching = false;
let seekTimer = null;

const PIECE_VAL = { p:1, n:3, b:3, r:5, q:9, k:0 };

function selectGame(g) {
  selectedGame = g;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + g).classList.add("active");
  startLocalBot();
}

// ==========================================
// 4. INITIALIZE & CLOCK MANAGEMENT
// ==========================================
function initMatch(gType, tSec, oppName, side) {
  gameType = gType;
  selectedGame = gType;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + gType).classList.add("active");

  baseTime = tSec;
  clocks = { 1: tSec, 2: tSec };
  winner = 0;
  endReason = "";
  opponentName = oppName;
  mySide = side;
  selected = null;
  legalTargets = [];
  lastMove = null;
  moveLog = [];

  if (gameType === "chess") {
    chess = new Chess();
  } else if (gameType === "checkers") {
    chkTurn = 1;
    chkBoard = Array.from({ length: 8 }, (_, r) =>
      Array.from({ length: 8 }, (_, c) => {
        if ((r + c) % 2 === 1) {
          if (r < 3) return 2;
          if (r > 4) return 1;
        }
        return 0;
      })
    );
  } else {
    c4Turn = 1;
    c4Board = Array.from({ length: 6 }, () => Array(7).fill(0));
  }

  document.getElementById("btnDraw").disabled = (mode === "bot");
  document.getElementById("btnResign").disabled = false;
  document.getElementById("btnRematch").disabled = false;

  startClockLoop();
  renderAll();
}

function getCurrentTurn() {
  if (gameType === "chess") return chess.turn() === "w" ? 1 : 2;
  if (gameType === "checkers") return chkTurn;
  return c4Turn;
}

function startClockLoop() {
  if (clockTimer) clearInterval(clockTimer);
  if (baseTime === 0) return;
  clockTimer = setInterval(() => {
    if (winner !== 0) return;
    const t = getCurrentTurn();
    clocks[t] = Math.max(0, clocks[t] - 1);
    updateClockUI();
    if (clocks[t] === 0 && mode !== "guest") {
      finishMatch(3 - t, "on time");
      syncToPeer();
    }
  }, 1000);
}

function formatClock(sec) {
  if (baseTime === 0) return "--:--";
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function finishMatch(winSide, reason) {
  winner = winSide;
  endReason = reason;
  playSound("end");
  renderAll();
}

// ==========================================
// 5. SCHOOL-WIFI FRIENDLY WSS NETWORKING
// ==========================================
function setNetStatus(text, isOnline) {
  const el = document.getElementById("netBadge");
  el.textContent = text;
  el.className = "pill" + (isOnline ? " online" : "");
}

function cleanupNet() {
  searching = false;
  if (seekTimer) { clearInterval(seekTimer); seekTimer = null; }
  document.getElementById("btnQuick").textContent = "Find Online Match";
  lobbyTopic = "";
  roomTopic = "";
  if (mqttClient) {
    try { mqttClient.end(true); } catch (e) {}
    mqttClient = null;
  }
  setNetStatus("Offline", false);
}

function connectRelay(onConnected, brokerIdx = 0) {
  if (brokerIdx >= BROKERS.length) {
    setNetStatus("Blocked", false);
    setBanner("Network blocked relays — try Play vs Bot");
    cleanupNet();
    return;
  }
  setNetStatus("Connecting...", false);
  const url = BROKERS[brokerIdx];
  const client = mqtt.connect(url, {
    clientId: myClientId,
    clean: true,
    connectTimeout: 4500,
    reconnectPeriod: 0
  });

  let connected = false;
  const fallbackTimer = setTimeout(() => {
    if (!connected) {
      try { client.end(true); } catch (e) {}
      connectRelay(onConnected, brokerIdx + 1);
    }
  }, 4800);

  client.on("connect", () => {
    connected = true;
    clearTimeout(fallbackTimer);
    mqttClient = client;
    setNetStatus("Connected", true);
    client.on("message", handleIncomingPacket);
    onConnected();
  });

  client.on("error", () => {
    if (!connected) {
      clearTimeout(fallbackTimer);
      try { client.end(true); } catch (e) {}
      connectRelay(onConnected, brokerIdx + 1);
    }
  });
}

function sendRoomMsg(obj) {
  if (!mqttClient || !mqttClient.connected || !roomTopic) return;
  obj.sender = myClientId;
  mqttClient.publish(roomTopic, JSON.stringify(obj));
}

function startLocalBot() {
  cleanupNet();
  mode = "bot";
  const t = parseInt(document.getElementById("timeSelect").value, 10);
  initMatch(selectedGame, t, "Minimax Bot", 1);
}

function findQuickMatch() {
  if (searching) {
    cleanupNet();
    setBanner("Matchmaking cancelled");
    return;
  }
  cleanupNet();
  searching = true;
  document.getElementById("btnQuick").textContent = "Cancel Search...";
  const g = selectedGame;
  const t = parseInt(document.getElementById("timeSelect").value, 10);
  setBanner("Connecting to lobby...");

  connectRelay(() => {
    if (!searching) return;
    lobbyTopic = `boardhub/v1/lobby/${g}/${t}`;
    mqttClient.subscribe(lobbyTopic, () => {
      setBanner("Searching for an opponent...");
      const broadcastSeek = () => {
        if (searching && mqttClient && mqttClient.connected) {
          mqttClient.publish(lobbyTopic, JSON.stringify({
            type: "seek",
            sender: myClientId,
            guestId
          }));
        }
      };
      broadcastSeek();
      seekTimer = setInterval(broadcastSeek, 2000);
    });
  });
}

function hostFriendRoom() {
  cleanupNet();
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const g = selectedGame;
  const t = parseInt(document.getElementById("timeSelect").value, 10);
  setBanner("Creating room...");

  connectRelay(() => {
    mode = "host";
    roomTopic = `boardhub/v1/room/${code}`;
    mqttClient.subscribe(roomTopic, () => {
      initMatch(g, t, "Waiting...", 1);
      setBanner(`Room Code: ${code} — Share with friend!`);
    });
  });
}

function joinFriendRoom() {
  const code = document.getElementById("codeInput").value.trim();
  if (code.length !== 4) {
    setBanner("Enter a 4-digit room code first");
    return;
  }
  cleanupNet();
  setBanner(`Joining room ${code}...`);

  connectRelay(() => {
    mode = "guest";
    roomTopic = `boardhub/v1/room/${code}`;
    mqttClient.subscribe(roomTopic, () => {
      sendRoomMsg({ type: "hello", guestId });
    });
  });
}

function handleIncomingPacket(topic, payloadBuf) {
  let msg;
  try {
    msg = JSON.parse(payloadBuf.toString());
  } catch (e) {
    return;
  }
  if (!msg || msg.sender === myClientId) return;

  if (topic === lobbyTopic && searching) {
    const g = selectedGame;
    const t = parseInt(document.getElementById("timeSelect").value, 10);

    if (msg.type === "seek" && myClientId < msg.sender) {
      searching = false;
      if (seekTimer) { clearInterval(seekTimer); seekTimer = null; }
      document.getElementById("btnQuick").textContent = "Find Online Match";
      mqttClient.unsubscribe(lobbyTopic);

      const roomId = `m_${myClientId}_${msg.sender}`;
      roomTopic = `boardhub/v1/room/${roomId}`;
      mode = "host";

      mqttClient.subscribe(roomTopic, () => {
        initMatch(g, t, msg.guestId || "Opponent", 1);
        mqttClient.publish(lobbyTopic, JSON.stringify({
          type: "matched",
          sender: myClientId,
          target: msg.sender,
          roomId,
          payload: buildSyncPayload()
        }));
      });
    } else if (msg.type === "matched" && msg.target === myClientId) {
      searching = false;
      if (seekTimer) { clearInterval(seekTimer); seekTimer = null; }
      document.getElementById("btnQuick").textContent = "Find Online Match";
      mqttClient.unsubscribe(lobbyTopic);

      roomTopic = `boardhub/v1/room/${msg.roomId}`;
      mode = "guest";
      mqttClient.subscribe(roomTopic, () => {
        applySync(msg.payload);
      });
    }
    return;
  }

  if (topic === roomTopic) {
    if (mode === "host") {
      if (msg.type === "hello") {
        opponentName = msg.guestId || "Friend";
        initMatch(gameType, baseTime, opponentName, 1);
        sendRoomMsg({ type: "welcome", payload: buildSyncPayload() });
      } else if (msg.type === "move") {
        executeMove(msg.move, 2, true);
      } else if (msg.type === "resign") {
        finishMatch(1, "by resignation");
        syncToPeer();
      } else if (msg.type === "draw_offer") {
        if (confirm(`${opponentName} offers a draw. Accept?`)) {
          finishMatch(3, "by agreement");
          syncToPeer();
        }
      } else if (msg.type === "draw_accept") {
        finishMatch(3, "by agreement");
        syncToPeer();
      } else if (msg.type === "rematch") {
        initMatch(gameType, baseTime, opponentName, mySide === 1 ? 2 : 1);
        syncToPeer();
      }
    } else if (mode === "guest") {
      if (msg.type === "welcome" || msg.type === "sync") {
        applySync(msg.payload);
      } else if (msg.type === "draw_offer") {
        if (confirm(`${opponentName} offers a draw. Accept?`)) {
          sendRoomMsg({ type: "draw_accept" });
        }
      }
    }
  }
}

function buildSyncPayload() {
  return {
    gameType, baseTime, clocks, winner, endReason,
    hostName: guestId,
    guestSide: mySide === 1 ? 2 : 1,
    fen: chess.fen(),
    chkBoard, chkTurn, c4Board, c4Turn,
    lastMove, moveLog
  };
}

function syncToPeer() {
  if (mode === "host") {
    sendRoomMsg({ type: "sync", payload: buildSyncPayload() });
  }
}

function applySync(p) {
  const prevLen = moveLog.length;
  gameType = p.gameType;
  selectedGame = p.gameType;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + gameType).classList.add("active");

  baseTime = p.baseTime;
  clocks = p.clocks;
  winner = p.winner;
  endReason = p.endReason;
  opponentName = p.hostName;
  mySide = p.guestSide;
  if (gameType === "chess") chess.load(p.fen);
  chkBoard = p.chkBoard;
  chkTurn = p.chkTurn;
  c4Board = p.c4Board;
  c4Turn = p.c4Turn;
  lastMove = p.lastMove;
  moveLog = p.moveLog;

  document.getElementById("btnDraw").disabled = false;
  document.getElementById("btnResign").disabled = false;
  document.getElementById("btnRematch").disabled = false;

  if (moveLog.length > prevLen) playSound("move");
  if (winner !== 0) playSound("end");
  startClockLoop();
  renderAll();
}

// ==========================================
// 6. MOVE EXECUTION & RULES (CHESS / CHK / C4)
// ==========================================
function requestMove(mv) {
  if (winner !== 0 || getCurrentTurn() !== mySide) return;
  if (mode === "guest") {
    sendRoomMsg({ type: "move", move: mv });
  } else {
    executeMove(mv, mySide, true);
  }
}

function executeMove(mv, side, allowBotReply) {
  if (winner !== 0 || getCurrentTurn() !== side) return false;

  if (gameType === "chess") {
    const res = chess.move(mv);
    if (!res) return false;
    lastMove = [res.from, res.to];
    moveLog.push(res.san);
    playSound(chess.in_check() ? "check" : (res.captured ? "capture" : "move"));

    if (chess.game_over()) {
      if (chess.in_checkmate()) finishMatch(side, "by checkmate");
      else finishMatch(3, "by draw");
    }
  } else if (gameType === "checkers") {
    const legal = getCheckersMoves(chkBoard, side);
    const match = legal.find(m => m.r1 === mv.r1 && m.c1 === mv.c1 && m.r2 === mv.r2 && m.c2 === mv.c2);
    if (!match) return false;
    applyCheckersMove(chkBoard, match);
    lastMove = [`${match.r1},${match.c1}`, `${match.r2},${match.c2}`];
    moveLog.push(`${String.fromCharCode(97 + match.c1)}${8 - match.r1}→${String.fromCharCode(97 + match.c2)}${8 - match.r2}`);
    playSound(match.jump ? "capture" : "move");

    chkTurn = 3 - side;
    if (getCheckersMoves(chkBoard, chkTurn).length === 0) {
      finishMatch(side, "no moves left");
    }
  } else if (gameType === "c4") {
    const r = dropC4(c4Board, mv.col, side);
    if (r === -1) return false;
    lastMove = [`${r},${mv.col}`];
    moveLog.push(`Col ${mv.col + 1}`);
    playSound("move");

    if (checkC4Win(c4Board, r, mv.col, side)) {
      finishMatch(side, "4 in a row");
    } else if (c4Board[0].every(x => x !== 0)) {
      finishMatch(3, "board full");
    } else {
      c4Turn = 3 - side;
    }
  }

  selected = null;
  legalTargets = [];
  renderAll();
  syncToPeer();

  if (mode === "bot" && allowBotReply && winner === 0 && getCurrentTurn() === 2) {
    setTimeout(runBotTurn, 280);
  }
  return true;
}

// ==========================================
// 7. SMART BOT AI (MINIMAX)
// ==========================================
function runBotTurn() {
  if (winner !== 0) return;
  if (gameType === "chess") {
    const moves = chess.moves({ verbose: true });
    if (!moves.length) return;
    let bestScore = Infinity;
    let bestMoves = [];
    for (const m of moves) {
      chess.move(m);
      const score = minimaxChess(1, -Infinity, Infinity, true);
      chess.undo();
      if (score < bestScore) { bestScore = score; bestMoves = [m]; }
      else if (score === bestScore) bestMoves.push(m);
    }
    const pick = bestMoves[Math.floor(Math.random() * bestMoves.length)];
    executeMove({ from: pick.from, to: pick.to, promotion: pick.promotion || "q" }, 2, false);
  } else if (gameType === "checkers") {
    const moves = getCheckersMoves(chkBoard, 2);
    if (!moves.length) return;
    const pick = moves[Math.floor(Math.random() * moves.length)];
    executeMove(pick, 2, false);
  } else if (gameType === "c4") {
    const valid = [0,1,2,3,4,5,6].filter(c => c4Board[0][c] === 0);
    for (const p of [2, 1]) {
      for (const c of valid) {
        const copy = c4Board.map(r => [...r]);
        const r = dropC4(copy, c, p);
        if (checkC4Win(copy, r, c, p)) {
          executeMove({ col: c }, 2, false);
          return;
        }
      }
    }
    valid.sort((a, b) => Math.abs(3 - a) - Math.abs(3 - b));
    executeMove({ col: valid[0] }, 2, false);
  }
}

function evalChessBoard() {
  if (chess.in_checkmate()) return chess.turn() === "w" ? -9999 : 9999;
  if (chess.in_draw()) return 0;
  let total = 0;
  const b = chess.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p) continue;
      const centerBonus = (r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 0.15 : 0;
      const v = PIECE_VAL[p.type] + centerBonus;
      total += p.color === "w" ? v : -v;
    }
  }
  return total;
}

function minimaxChess(depth, alpha, beta, isMax) {
  if (depth === 0 || chess.game_over()) return evalChessBoard();
  const moves = chess.moves({ verbose: true });
  if (isMax) {
    let maxEval = -Infinity;
    for (const m of moves) {
      chess.move(m);
      maxEval = Math.max(maxEval, minimaxChess(depth - 1, alpha, beta, false));
      chess.undo();
      alpha = Math.max(alpha, maxEval);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (const m of moves) {
      chess.move(m);
      minEval = Math.min(minEval, minimaxChess(depth - 1, alpha, beta, true));
      chess.undo();
      beta = Math.min(beta, minEval);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

function getCheckersMoves(b, side) {
  const steps = [], jumps = [];
  const mine = side === 1 ? [1, 3] : [2, 4];
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const v = b[r][c];
      if (!mine.includes(v)) continue;
      const dirs = v > 2 ? [[-1,-1],[-1,1],[1,-1],[1,1]] : (side === 1 ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
          if (b[nr][nc] === 0) steps.push({ r1: r, c1: c, r2: nr, c2: nc, jump: false });
          else if (!mine.includes(b[nr][nc])) {
            const jr = r + dr * 2, jc = c + dc * 2;
            if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8 && b[jr][jc] === 0) {
              jumps.push({ r1: r, c1: c, r2: jr, c2: jc, jump: true });
            }
          }
        }
      }
    }
  }
  return jumps.length ? jumps : steps;
}

function applyCheckersMove(b, m) {
  let v = b[m.r1][m.c1];
  b[m.r1][m.c1] = 0;
  if ((v === 1 && m.r2 === 0) || (v === 2 && m.r2 === 7)) v += 2;
  b[m.r2][m.c2] = v;
  if (m.jump) b[(m.r1 + m.r2) / 2][(m.c1 + m.c2) / 2] = 0;
}

function dropC4(b, col, side) {
  if (col < 0 || col > 6 || b[0][col] !== 0) return -1;
  for (let r = 5; r >= 0; r--) {
    if (b[r][col] === 0) { b[r][col] = side; return r; }
  }
  return -1;
}

function checkC4Win(b, r, c, side) {
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    let cnt = 1;
    for (const s of [-1, 1]) {
      let nr = r + dr * s, nc = c + dc * s;
      while (nr >= 0 && nr < 6 && nc >= 0 && nc < 7 && b[nr][nc] === side) {
        cnt++; nr += dr * s; nc += dc * s;
      }
    }
    if (cnt >= 4) return true;
  }
  return false;
}

// ==========================================
// 8. MATCH ACTIONS (DRAW, RESIGN, REMATCH)
// ==========================================
function resignGame() {
  if (winner !== 0) return;
  if (mode === "guest") {
    sendRoomMsg({ type: "resign" });
  } else {
    finishMatch(3 - mySide, "by resignation");
    syncToPeer();
  }
}

function offerDraw() {
  if (winner !== 0 || mode === "bot") return;
  sendRoomMsg({ type: "draw_offer" });
  setBanner("Draw offer sent...");
}

function requestRematch() {
  if (mode === "bot") {
    startLocalBot();
  } else if (mode === "host") {
    initMatch(gameType, baseTime, opponentName, mySide === 1 ? 2 : 1);
    syncToPeer();
  } else if (mode === "guest") {
    sendRoomMsg({ type: "rematch" });
  }
}

// ==========================================
// 9. RENDER BOARD, CAPTURED PIECES & UI
// ==========================================
function setBanner(msg) {
  document.getElementById("statusBanner").textContent = msg;
}

function updateClockUI() {
  const oppSide = 3 - mySide;
  const turn = getCurrentTurn();
  const topEl = document.getElementById("topClock");
  const botEl = document.getElementById("botClock");

  topEl.textContent = formatClock(clocks[oppSide]);
  botEl.textContent = formatClock(clocks[mySide]);

  topEl.className = "timer" + (winner === 0 && turn === oppSide ? " active" : "") + (clocks[oppSide] <= 10 && baseTime > 0 ? " low" : "");
  botEl.className = "timer" + (winner === 0 && turn === mySide ? " active" : "") + (clocks[mySide] <= 10 && baseTime > 0 ? " low" : "");
}

function updateCapturedUI() {
  const topCap = document.getElementById("topCap");
  const botCap = document.getElementById("botCap");
  if (gameType !== "chess") { topCap.innerHTML = ""; botCap.innerHTML = ""; return; }

  const start = { p:8, n:2, b:2, r:2, q:1 };
  const curW = { p:0, n:0, b:0, r:0, q:0 };
  const curB = { p:0, n:0, b:0, r:0, q:0 };
  for (const row of chess.board()) {
    for (const sq of row) {
      if (!sq || sq.type === "k") continue;
      if (sq.color === "w") curW[sq.type]++; else curB[sq.type]++;
    }
  }
  let wLostHTML = "", bLostHTML = "", wMat = 0, bMat = 0;
  for (const t of ["q","r","b","n","p"]) {
    const mw = Math.max(0, start[t] - curW[t]);
    const mb = Math.max(0, start[t] - curB[t]);
    wLostHTML += getPieceSVG("w", t, "cap-icon").repeat(mw);
    bLostHTML += getPieceSVG("b", t, "cap-icon").repeat(mb);
    wMat += curW[t] * PIECE_VAL[t];
    bMat += curB[t] * PIECE_VAL[t];
  }
  const diff = wMat - bMat;
  const wStr = bLostHTML + (diff > 0 ? `<span style="margin-left:4px">+${diff}</span>` : "");
  const bStr = wLostHTML + (diff < 0 ? `<span style="margin-left:4px">+${Math.abs(diff)}</span>` : "");
  botCap.innerHTML = mySide === 1 ? wStr : bStr;
  topCap.innerHTML = mySide === 1 ? bStr : wStr;
}

function renderAll() {
  const oppSide = 3 - mySide;
  document.getElementById("botName").textContent = `${guestId} (You)`;
  document.getElementById("topName").textContent = opponentName;
  document.getElementById("botAvatar").textContent = mySide === 1 ? "P1" : "P2";
  document.getElementById("topAvatar").textContent = oppSide === 1 ? "P1" : "P2";

  updateClockUI();
  updateCapturedUI();

  if (winner === 3) setBanner(`Draw (${endReason})`);
  else if (winner === mySide) setBanner(`You Won ${endReason}!`);
  else if (winner === oppSide) setBanner(`${opponentName} Won ${endReason}`);
  else {
    const myTurn = getCurrentTurn() === mySide;
    const chk = (gameType === "chess" && chess.in_check()) ? " — CHECK!" : "";
    setBanner((myTurn ? "Your Turn" : `${opponentName}'s Turn`) + chk);
  }

  const box = document.getElementById("movesBox");
  box.innerHTML = "";
  for (let i = 0; i < moveLog.length; i += 2) {
    const row = document.createElement("div");
    row.className = "m-row";
    row.innerHTML = `<span class="m-idx">${Math.floor(i/2)+1}.</span><span>${moveLog[i]}</span><span>${moveLog[i+1] || ""}</span>`;
    box.appendChild(row);
  }
  box.scrollTop = box.scrollHeight;

  renderBoard();
}

function renderBoard() {
  const bd = document.getElementById("board");
  bd.innerHTML = "";

  if (gameType === "c4") {
    bd.style.gridTemplateColumns = "repeat(7, 1fr)";
    bd.style.gridTemplateRows = "repeat(6, 1fr)";
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 7; c++) {
        const sq = document.createElement("div");
        sq.className = "c4-sq";
        const hole = document.createElement("div");
        const v = c4Board[r][c];
        hole.className = "c4-hole" + (v === 1 ? " p1" : v === 2 ? " p2" : "");
        sq.appendChild(hole);
        sq.onclick = () => requestMove({ col: c });
        bd.appendChild(sq);
      }
    }
    return;
  }

  bd.style.gridTemplateColumns = "repeat(8, 1fr)";
  bd.style.gridTemplateRows = "repeat(8, 1fr)";
  const rows = mySide === 2 ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  const cols = mySide === 2 ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

  if (gameType === "chess") {
    const b = chess.board();
    const inCheck = chess.in_check();
    const turnColor = chess.turn();

    for (let ri = 0; ri < 8; ri++) {
      for (let ci = 0; ci < 8; ci++) {
        const r = rows[ri], c = cols[ci];
        const sqName = String.fromCharCode(97 + c) + (8 - r);
        const piece = b[r][c];
        const sq = document.createElement("div");

        let cls = "sq " + ((r + c) % 2 === 0 ? "light" : "dark");
        if (lastMove && lastMove.includes(sqName)) cls += " last";
        if (selected === sqName) cls += " sel";
        if (inCheck && piece && piece.type === "k" && piece.color === turnColor) cls += " check";
        sq.className = cls;

        if (ci === 0) {
          const rk = document.createElement("span");
          rk.className = "coord rank"; rk.textContent = 8 - r;
          sq.appendChild(rk);
        }
        if (ri === 7) {
          const fl = document.createElement("span");
          fl.className = "coord file"; fl.textContent = String.fromCharCode(97 + c);
          sq.appendChild(fl);
        }

        if (piece) {
          sq.insertAdjacentHTML("beforeend", getPieceSVG(piece.color, piece.type));
        }

        const targetMove = legalTargets.find(m => m.to === sqName);
        if (targetMove) {
          const marker = document.createElement("div");
          marker.className = piece ? "ring" : "dot";
          sq.appendChild(marker);
        }

        sq.onclick = () => onChessSquareClick(sqName, piece);
        bd.appendChild(sq);
      }
    }
  } else if (gameType === "checkers") {
    for (let ri = 0; ri < 8; ri++) {
      for (let ci = 0; ci < 8; ci++) {
        const r = rows[ri], c = cols[ci];
        const key = `${r},${c}`;
        const v = chkBoard[r][c];
        const sq = document.createElement("div");
        let cls = "sq " + ((r + c) % 2 === 0 ? "light" : "dark");
        if (lastMove && lastMove.includes(key)) cls += " last";
        if (selected === key) cls += " sel";
        sq.className = cls;

        if (v) {
          const disc = document.createElement("div");
          disc.className = "chk-disc " + (v % 2 === 1 ? "p1" : "p2");
          disc.textContent = v > 2 ? "K" : "";
          sq.appendChild(disc);
        }

        const targetMove = legalTargets.find(m => m.r2 === r && m.c2 === c);
        if (targetMove) {
          const dot = document.createElement("div");
          dot.className = "dot";
          sq.appendChild(dot);
        }

        sq.onclick = () => onCheckersSquareClick(r, c, v);
        bd.appendChild(sq);
      }
    }
  }
}

function onChessSquareClick(sqName, piece) {
  if (winner !== 0 || getCurrentTurn() !== mySide) return;
  const myColor = mySide === 1 ? "w" : "b";

  const target = legalTargets.find(m => m.to === sqName);
  if (target) {
    if (target.flags.includes("p")) {
      showPromotionPicker(target.from, target.to, myColor);
    } else {
      requestMove({ from: target.from, to: target.to });
    }
    return;
  }

  if (piece && piece.color === myColor) {
    selected = sqName;
    legalTargets = chess.moves({ square: sqName, verbose: true });
  } else {
    selected = null;
    legalTargets = [];
  }
  renderBoard();
}

function showPromotionPicker(from, to, color) {
  const modal = document.getElementById("promoModal");
  const box = document.getElementById("promoChoices");
  box.innerHTML = "";
  for (const p of ["q", "r", "b", "n"]) {
    const btn = document.createElement("button");
    btn.className = "promo-btn";
    btn.innerHTML = getPieceSVG(color, p);
    btn.onclick = () => {
      modal.style.display = "none";
      requestMove({ from, to, promotion: p });
    };
    box.appendChild(btn);
  }
  modal.style.display = "flex";
}

function onCheckersSquareClick(r, c, v) {
  if (winner !== 0 || getCurrentTurn() !== mySide) return;
  const target = legalTargets.find(m => m.r2 === r && m.c2 === c);
  if (target) {
    requestMove(target);
    return;
  }
  const isMine = v && (v % 2 === (mySide === 1 ? 1 : 0));
  if (isMine) {
    selected = `${r},${c}`;
    legalTargets = getCheckersMoves(chkBoard, mySide).filter(m => m.r1 === r && m.c1 === c);
  } else {
    selected = null;
    legalTargets = [];
  }
  renderBoard();
}

startLocalBot();
</script>
</body>
</html>
